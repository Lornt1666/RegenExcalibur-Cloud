name: AutoHouse v450 permit-authority closure

on:
  pull_request:
    paths:
      - 'autohouse/v450/**'
      - '.github/workflows/autohouse-v450-permit-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v450-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile permit release engine
        run: python -m py_compile autohouse/v450/permit_release_engine_v450.py autohouse/v450/selftest_v450.py
      - name: Run fail-closed release selftest
        run: python autohouse/v450/selftest_v450.py
